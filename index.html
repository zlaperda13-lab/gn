<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>?</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", monospace;
    cursor: none;
}

/* ===== ФАЗА 1: ЗАТИШЬЕ ===== */

#buildup {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    transition: opacity 0.4s;
}

#buildup.gone { opacity: 0; pointer-events: none; }

#buildup .whisper {
    position: absolute;
    color: #4a5a4a;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 1.2s ease;
    text-transform: uppercase;
    text-align: center;
    padding: 0 20px;
}

#buildup .whisper.on { opacity: 0.7; }

#startBtn {
    background: transparent;
    border: 1px solid #3a5a3a;
    color: #7ea87e;
    font-family: "Courier New", monospace;
    font-size: clamp(14px, 2vw, 20px);
    padding: 18px 34px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    animation: pulse 2s infinite;
}

#startBtn:hover {
    border-color: #7ea87e;
    color: #b0e0b0;
    text-shadow: 0 0 12px #7ea87e;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* ===== ФАЗА 2: СКРИМЕР ===== */

#scream {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    overflow: hidden;
}

#scream.on {
    display: flex;
    animation: screenShake 0.04s infinite;
}

@keyframes screenShake {
    0%   { transform: translate(0, 0); }
    20%  { transform: translate(-15px, 10px); }
    40%  { transform: translate(15px, -10px); }
    60%  { transform: translate(-10px, -15px); }
    80%  { transform: translate(10px, 15px); }
    100% { transform: translate(0, 0); }
}

#face {
    width: 100%;
    height: 100%;
    object-fit: contain;
    animation: faceStrobe 0.09s infinite;
    filter: contrast(1.4) saturate(1.3);
}

@keyframes faceStrobe {
    0%   { filter: brightness(1.1) contrast(1.4) saturate(1.3); }
    50%  { filter: brightness(0.4) contrast(2) saturate(1.6) hue-rotate(-15deg); }
    100% { filter: brightness(1.3) contrast(1.5) saturate(1.3); }
}

#scream .redflash {
    position: absolute;
    inset: 0;
    background: #6a0000;
    mix-blend-mode: multiply;
    animation: redFlash 0.12s infinite;
    pointer-events: none;
}

@keyframes redFlash {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.55; }
}

#scream .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0.55) 0px, rgba(0,0,0,0.55) 2px,
        transparent 2px, transparent 4px);
    animation: scanMove 0.08s linear infinite;
    pointer-events: none;
}

@keyframes scanMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
}

#scream .noise {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg,
        rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px,
        transparent 1px, transparent 2px);
    animation: noiseMove 0.05s steps(4) infinite;
    mix-blend-mode: screen;
    pointer-events: none;
}

@keyframes noiseMove {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-4px, 4px); }
    50%  { transform: translate(4px, -4px); }
    75%  { transform: translate(-4px, -4px); }
    100% { transform: translate(4px, 4px); }
}

/* ===== ФАЗА 3: ТИШИНА И НАДПИСЬ ===== */

#ending {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
}

#ending.on { display: flex; }

#finalText {
    font-family: "Courier New", monospace;
    font-size: clamp(24px, 6vw, 72px);
    color: #b0b0b0;
    letter-spacing: 12px;
    text-transform: uppercase;
    text-align: center;
    padding: 0 20px;
    text-shadow: 0 0 20px rgba(180, 180, 180, 0.4);
    font-weight: bold;
    white-space: nowrap;
}

#finalText .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: #b0b0b0;
    vertical-align: -0.12em;
    margin-left: 0.15em;
    animation: blink 1s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

#ending .subtext {
    margin-top: 40px;
    font-size: clamp(12px, 1.6vw, 16px);
    color: #444;
    letter-spacing: 4px;
    opacity: 0;
    transition: opacity 2s ease;
    text-transform: lowercase;
}

#ending .subtext.on { opacity: 0.7; }
</style>
</head>

<body>

<!-- ФАЗА 1 -->
<div id="buildup">
    <div class="whisper" id="whisper">ты один?</div>
    <button id="startBtn">нажми, если не боишься</button>
</div>

<!-- ФАЗА 2: СКРИМЕР -->
<div id="scream">
    <svg id="face" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid slice">
        <defs>
            <radialGradient id="skinGrad" cx="50%" cy="40%" r="70%">
                <stop offset="0%" stop-color="#c9b8a0"/>
                <stop offset="55%" stop-color="#8a7258"/>
                <stop offset="100%" stop-color="#2a1a10"/>
            </radialGradient>
            <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff0000"/>
                <stop offset="60%" stop-color="#8a0000"/>
                <stop offset="100%" stop-color="#000"/>
            </radialGradient>
            <filter id="rough">
                <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>
                <feDisplacementMap in="SourceGraphic" scale="4"/>
            </filter>
        </defs>

        <!-- фон -->
        <rect width="500" height="600" fill="#000"/>

        <!-- голова -->
        <ellipse cx="250" cy="270" rx="160" ry="220" fill="url(#skinGrad)" filter="url(#rough)"/>

        <!-- трещины по коже -->
        <path d="M140 180 Q160 220 150 260 Q145 290 160 320" stroke="#3a1a0a" stroke-width="2" fill="none" opacity="0.7"/>
        <path d="M360 200 Q350 250 365 300" stroke="#3a1a0a" stroke-width="2" fill="none" opacity="0.7"/>
        <path d="M200 400 Q220 430 210 470" stroke="#3a1a0a" stroke-width="2" fill="none" opacity="0.6"/>

        <!-- глазницы -->
        <ellipse cx="180" cy="240" rx="48" ry="60" fill="#000"/>
        <ellipse cx="320" cy="240" rx="48" ry="60" fill="#000"/>

        <!-- краснота вокруг глаз -->
        <ellipse cx="180" cy="240" rx="58" ry="72" fill="#3a0000" opacity="0.8"/>
        <ellipse cx="320" cy="240" rx="58" ry="72" fill="#3a0000" opacity="0.8"/>

        <!-- светящиеся зрачки -->
        <circle cx="180" cy="245" r="18" fill="url(#eyeGlow)"/>
        <circle cx="320" cy="245" r="18" fill="url(#eyeGlow)"/>
        <circle cx="180" cy="245" r="6" fill="#ffffff"/>
        <circle cx="320" cy="245" r="6" fill="#ffffff"/>

        <!-- нос -->
        <path d="M250 280 L225 345 L275 345 Z" fill="#000"/>
        <path d="M225 345 Q240 355 250 350 Q260 355 275 345" stroke="#000" stroke-width="3" fill="none"/>

        <!-- разинутый рот -->
        <ellipse cx="250" cy="450" rx="70" ry="95" fill="#000"/>
        <ellipse cx="250" cy="450" rx="70" ry="95" fill="none" stroke="#5a0000" stroke-width="4"/>

        <!-- зубы сверху -->
        <path d="M185 380 L195 410 L205 380 L215 415 L225 380 L235 418 L245 380
                 L255 418 L265 380 L275 415 L285 380 L295 410 L305 380"
              fill="#e8dcc0" stroke="#3a1a0a" stroke-width="1"/>

        <!-- зубы снизу -->
        <path d="M190 520 L200 495 L210 520 L220 490 L230 520 L240 488 L250 520
                 L260 488 L270 520 L280 490 L290 520 L300 495 L310 520"
              fill="#e8dcc0" stroke="#3a1a0a" stroke-width="1"/>

        <!-- язык/тёмная глотка -->
        <ellipse cx="250" cy="480" rx="40" ry="30" fill="#2a0000"/>

        <!-- кровь из глаз -->
        <path d="M180 300 Q175 380 185 470" stroke="#6a0000" stroke-width="8" fill="none" opacity="0.9"/>
        <path d="M320 300 Q325 380 315 470" stroke="#6a0000" stroke-width="8" fill="none" opacity="0.9"/>
        <path d="M180 300 Q178 400 190 520" stroke="#3a0000" stroke-width="4" fill="none" opacity="0.7"/>
        <path d="M320 300 Q322 400 310 520" stroke="#3a0000" stroke-width="4" fill="none" opacity="0.7"/>

        <!-- капли крови -->
        <circle cx="175" cy="500" r="6" fill="#6a0000"/>
        <circle cx="325" cy="520" r="5" fill="#6a0000"/>
        <circle cx="185" cy="550" r="4" fill="#3a0000"/>

        <!-- текст на лбу -->
        <text x="250" y="130" text-anchor="middle" fill="#6a0000"
              font-family="Courier New" font-size="24" font-weight="bold"
              letter-spacing="6">НЕ ОГЛЯДЫВАЙСЯ</text>
    </svg>

    <div class="redflash"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
</div>

<!-- ФАЗА 3: ФИНАЛ -->
<div id="ending">
    <div id="finalText"></div>
    <div class="subtext" id="subtext">засыпай...</div>
</div>

<script>
(function () {
    "use strict";

    const buildup   = document.getElementById("buildup");
    const whisper   = document.getElementById("whisper");
    const startBtn  = document.getElementById("startBtn");
    const screamBox = document.getElementById("scream");
    const ending    = document.getElementById("ending");
    const finalText = document.getElementById("finalText");
    const subtext   = document.getElementById("subtext");

    /* ================= АУДИО ================= */

    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
    }

    /* зловещий гул во время затишья */
    function playDrone(duration) {
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        osc1.type = "sine";
        osc1.frequency.value = 42;

        const osc2 = audioCtx.createOscillator();
        osc2.type = "sine";
        osc2.frequency.value = 63;
        osc2.detune.value = 8;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 1.5);
        gain.gain.linearRampToValueAtTime(0.2, now + duration - 1.5);
        gain.gain.linearRampToValueAtTime(0, now + duration);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration);
        osc2.stop(now + duration);
    }

    /* сам скрим */
    function playScream() {
        const now = audioCtx.currentTime;
        const dur = 1.6;

        /* шум */
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        /* жёсткая дисторшн */
        const shaper = audioCtx.createWaveShaper();
        const curve = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) {
            const x = (i / 32768) - 1;
            curve[i] = Math.tanh(x * 6);
        }
        shaper.curve = curve;

        /* полосовой фильтр */
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1800, now);
        filter.frequency.exponentialRampToValueAtTime(400, now + dur);
        filter.Q.value = 1.2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.75, now + 0.03);
        gain.gain.setValueAtTime(0.75, now + dur * 0.7);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(shaper);
        shaper.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
        noise.stop(now + dur);

        /* низкий сабвуфер */
        const sub = audioCtx.createOscillator();
        sub.type = "sawtooth";
        sub.frequency.setValueAtTime(110, now);
        sub.frequency.exponentialRampToValueAtTime(28, now + dur);

        const subGain = audioCtx.createGain();
        subGain.gain.setValueAtTime(0.55, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        sub.connect(subGain);
        subGain.connect(audioCtx.destination);

        sub.start(now);
        sub.stop(now + dur);
    }

    /* ================= СЦЕНАРИЙ ================= */

    function start() {
        initAudio();

        buildup.classList.add("gone");
        startBtn.style.display = "none";

        /* ---- ЗАТИШЬЕ: 5 секунд ---- */
        const phrases = [
            "ты один?",
            "не оглядывайся",
            "он уже здесь",
            "он смотрит",
            "за твоей спиной",
            "он ближе, чем кажется",
            "не закрывай глаза"
        ];

        playDrone(5.2);

        let pi = 0;
        let stillRunning = true;

        function nextWhisper() {
            if (!stillRunning) return;
            if (pi >= phrases.length) return;

            whisper.textContent = phrases[pi];
            whisper.classList.add("on");
            pi++;

            setTimeout(function () {
                whisper.classList.remove("on");
                if (stillRunning) setTimeout(nextWhisper, 250);
            }, 550);
        }

        setTimeout(nextWhisper, 200);

        /* ---- СКРИМЕР ---- */
        setTimeout(function () {
            stillRunning = false;
            whisper.classList.remove("on");
            buildup.style.display = "none";

            playScream();

            screamBox.classList.add("on");

            if (navigator.vibrate) {
                try { navigator.vibrate([200, 50, 200, 50, 400]); } catch(e) {}
            }

            /* ---- ЗАТИХАНИЕ И ФИНАЛ ---- */
            setTimeout(function () {
                screamBox.classList.remove("on");
                screamBox.style.display = "none";
                ending.classList.add("on");

                /* пауза, чтобы ужас осел */
                setTimeout(function () {
                    typeFinal("СПОКОЙНОЙ НОЧИ");
                }, 2200);

            }, 1800);

        }, 5000);
    }

    /* ---- медленная печать финальной надписи ---- */

    function typeFinal(text) {
        let i = 0;
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        finalText.appendChild(cursor);

        function step() {
            if (i >= text.length) {
                /* курсор мигает, потом тухнет */
                setTimeout(function () {
                    cursor.style.display = "none";
                    subtext.classList.add("on");
                }, 2500);
                return;
            }

            const ch = text[i];
            cursor.insertAdjacentText("beforebegin", ch);
            i++;

            let delay = 260 + Math.random() * 220;
            if (ch === " ") delay = 700 + Math.random() * 400;
            if (Math.random() < 0.1) delay += 500;

            setTimeout(step, delay);
        }

        step();
    }

    /* ---- запуск ---- */

    startBtn.addEventListener("click", start);

})();
</script>

</body>
</html>
