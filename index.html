<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>?</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Courier New", monospace;
    cursor: none;
}

/* ===== ФАЗА 1: ЗАТИШЬЕ ===== */

#buildup {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    transition: opacity 0.4s;
}

#buildup.gone { opacity: 0; pointer-events: none; }

#buildup .whisper {
    position: absolute;
    color: #4a5a4a;
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 1.2s ease;
    text-transform: uppercase;
    text-align: center;
    padding: 0 20px;
}

#buildup .whisper.on { opacity: 0.7; }

#startBtn {
    background: transparent;
    border: 1px solid #3a5a3a;
    color: #7ea87e;
    font-family: "Courier New", monospace;
    font-size: clamp(14px, 2vw, 20px);
    padding: 18px 34px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    animation: pulse 2s infinite;
}

#startBtn:hover {
    border-color: #7ea87e;
    color: #b0e0b0;
    text-shadow: 0 0 12px #7ea87e;
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

/* ===== ФАЗА 2: СКРИМЕР ===== */

#scream {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    overflow: hidden;
}

#scream.on {
    display: flex;
    animation: screenShake 0.035s infinite;
}

@keyframes screenShake {
    0%   { transform: translate(0, 0) rotate(0deg); }
    15%  { transform: translate(-18px, 12px) rotate(-0.6deg); }
    30%  { transform: translate(20px, -14px) rotate(0.7deg); }
    45%  { transform: translate(-14px, -20px) rotate(-0.4deg); }
    60%  { transform: translate(16px, 18px) rotate(0.5deg); }
    75%  { transform: translate(-20px, -8px) rotate(-0.8deg); }
    100% { transform: translate(18px, 12px) rotate(0.3deg); }
}

/* слой с лицом + зум */
#faceWrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
    transform: scale(0.35);
    animation: faceRush 1.9s cubic-bezier(0.75, 0, 0.95, 0.35) forwards;
}

@keyframes faceRush {
    0%   { transform: scale(0.35) rotate(0deg); }
    30%  { transform: scale(0.7) rotate(-3deg); }
    55%  { transform: scale(1.4) rotate(4deg); }
    75%  { transform: scale(2.6) rotate(-5deg); }
    100% { transform: scale(6) rotate(2deg); }
}

#face {
    width: 92vmin;
    height: 92vmin;
    max-width: 92vw;
    max-height: 92vw;
    filter: contrast(1.5) saturate(1.2) brightness(1.05);
    animation: faceStrobe 0.06s infinite;
}

@keyframes faceStrobe {
    0%   { filter: brightness(1.1) contrast(1.6) saturate(1.2); }
    40%  { filter: brightness(0.3) contrast(2.4) saturate(1.8) hue-rotate(-18deg); }
    70%  { filter: brightness(1.4) contrast(1.7) saturate(1.1); }
    100% { filter: brightness(0.6) contrast(2) saturate(1.5) hue-rotate(8deg); }
}

/* хроматическая аберрация — дублируем слой */
#faceGhost {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    mix-blend-mode: screen;
    opacity: 0.55;
    pointer-events: none;
    animation: ghostJitter 0.05s infinite;
    transform: scale(0.35);
    animation-name: ghostRush;
    animation-duration: 1.9s;
    animation-timing-function: cubic-bezier(0.75, 0, 0.95, 0.35);
    animation-fill-mode: forwards;
}

#faceGhost svg {
    width: 92vmin;
    height: 92vmin;
    max-width: 92vw;
    max-height: 92vw;
    filter: drop-shadow(6px 0 0 #ff0000) drop-shadow(-6px 0 0 #00ffff);
}

@keyframes ghostJitter {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-8px, 6px); }
    66%  { transform: translate(10px, -6px); }
    100% { transform: translate(-6px, -8px); }
}

@keyframes ghostRush {
    0%   { transform: scale(0.35); }
    30%  { transform: scale(0.7); }
    55%  { transform: scale(1.4); }
    75%  { transform: scale(2.6); }
    100% { transform: scale(6.3); }
}

/* красная заливка поверх */
#scream .redflash {
    position: absolute;
    inset: 0;
    background: #7a0000;
    mix-blend-mode: multiply;
    animation: redFlash 0.09s infinite;
    pointer-events: none;
}

@keyframes redFlash {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.75; }
}

#scream .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom,
        rgba(0,0,0,0.55) 0px, rgba(0,0,0,0.55) 2px,
        transparent 2px, transparent 4px);
    animation: scanMove 0.07s linear infinite;
    pointer-events: none;
    z-index: 3;
}

@keyframes scanMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(4px); }
}

#scream .noise {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg,
        rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px,
        transparent 1px, transparent 2px);
    animation: noiseMove 0.045s steps(4) infinite;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 4;
}

@keyframes noiseMove {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-6px, 6px); }
    50%  { transform: translate(6px, -6px); }
    75%  { transform: translate(-6px, -6px); }
    100% { transform: translate(6px, 6px); }
}

/* белые вспышки */
#scream .whiteFlash {
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    animation: whiteFlash 0.9s steps(1) infinite;
}

@keyframes whiteFlash {
    0%, 88%, 100% { opacity: 0; }
    90%, 92%      { opacity: 0.85; }
}

/* ===== ФАЗА 3: ТИШИНА И НАДПИСЬ ===== */

#ending {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
}

#ending.on { display: flex; }

#finalText {
    font-family: "Courier New", monospace;
    font-size: clamp(24px, 6vw, 72px);
    color: #b0b0b0;
    letter-spacing: 12px;
    text-transform: uppercase;
    text-align: center;
    padding: 0 20px;
    text-shadow: 0 0 20px rgba(180, 180, 180, 0.4);
    font-weight: bold;
    white-space: nowrap;
}

#finalText .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: #b0b0b0;
    vertical-align: -0.12em;
    margin-left: 0.15em;
    animation: blink 1s steps(1) infinite;
}

@keyframes blink { 50% { opacity: 0; } }

#ending .subtext {
    margin-top: 40px;
    font-size: clamp(12px, 1.6vw, 16px);
    color: #444;
    letter-spacing: 4px;
    opacity: 0;
    transition: opacity 2s ease;
    text-transform: lowercase;
}

#ending .subtext.on { opacity: 0.7; }
</style>
</head>

<body>

<!-- ФАЗА 1 -->
<div id="buildup">
    <div class="whisper" id="whisper">ты один?</div>
    <button id="startBtn">нажми, если не боишься</button>
</div>

<!-- ФАЗА 2: СКРИМЕР -->
<div id="scream">

    <!-- основной слой -->
    <div id="faceWrap">
        <svg id="face" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
            <defs>

            <ellipse cx="272" cy="298" rx="36" ry="58" fill="#1a0804" opacity="0.55"/>

            <!-- трещины и вены -->
            <g stroke="#2a0a04" fill="none" stroke-linecap="round" opacity="0.85">
                <path d="M118 130 Q135 175 128 220 Q122 250 138 285" stroke-width="2"/>
                <path d="M282 130 Q265 175 272 220 Q278 250 262 285" stroke-width="2"/>
                <path d="M172 90 Q186 130 178 175" stroke-width="1.5"/>
                <path d="M228 90 Q214 130 222 175" stroke-width="1.5"/>
                <path d="M155 400 Q170 415 165 440" stroke-width="2"/>
                <path d="M245 400 Q230 415 235 440" stroke-width="2"/>
                <path d="M200 350 Q210 380 200 405" stroke-width="1.8"/>
            </g>

            <!-- надбровные дуги — тяжёлые -->
            <path d="M85 158 Q140 128 195 148" stroke="#1a0804" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="M315 158 Q260 128 205 148" stroke="#1a0804" stroke-width="7" fill="none" stroke-linecap="round"/>

            <ellipse cx="140" cy="205" rx="50" ry="60" fill="url(#socket)" opacity="0.9"/>
            <ellipse cx="260" cy="205" rx="50" ry="60" fill="url(#socket)" opacity="0.9"/>

            <g stroke="#3a0000" fill="none" stroke-width="1" opacity="0.9">

            <!-- зрачки — точки -->
            <circle cx="140" cy="207" r="6" fill="#ffffff" filter="url(#glow)"/>

                <path d="M124 272 Q112 355 130 435" stroke="#3a0000" stroke-width="3" opacity="0.7"/>
                <path d="M276 272 Q288 355 270 435" stroke="#3a0000" stroke-width="3" opacity="0.7"/>

            <!-- капли -->
            <circle cx="128" cy="430" r="4" fill="#5a0000"/>

<!-- ФАЗА 3: ФИНАЛ -->

    <div id="finalText"></div>
    <div class="subtext" id="subtext">засыпай...</div>

<script>
(function () {
    "use strict";

    const buildup   = document.getElementById("buildup");
    const whisper   = document.getElementById("whisper");
    const startBtn  = document.getElementById("startBtn");
    const screamBox = document.getElementById("scream");
    const ending    = document.getElementById("ending");
    const finalText = document.getElementById("finalText");
    const subtext   = document.getElementById("subtext");

    /* ================= АУДИО ================= */

    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playDrone(duration) {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        osc1.type = "sine";
        osc1.frequency.value = 42;

        const osc2 = audioCtx.createOscillator();
        osc2.type = "sine";
        osc2.frequency.value = 63;
        osc2.detune.value = 8;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 1.5);
        gain.gain.linearRampToValueAtTime(0.2, now + duration - 1.5);
        gain.gain.linearRampToValueAtTime(0, now + duration);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now); osc2.start(now);
        osc1.stop(now + duration); osc2.stop(now + duration);
    }

    function playScream() {
        const now = audioCtx.currentTime;
        const dur = 2.0;

        /* ---- шум ---- */
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        /* ---- дисторшн ---- */
        const shaper = audioCtx.createWaveShaper();
        const curve = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) {
            const x = (i / 32768) - 1;
            curve[i] = Math.tanh(x * 7);
        }
        shaper.curve = curve;

        /* ---- полосовой ---- */
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(2200, now);
        filter.frequency.exponentialRampToValueAtTime(320, now + dur);
        filter.Q.value = 1.3;

        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0, now);
        noiseGain.gain.linearRampToValueAtTime(0.7, now + 0.03);
        noiseGain.gain.setValueAtTime(0.7, now + dur * 0.7);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(shaper);
        shaper.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        noise.start(now);
        noise.stop(now + dur);

        /* ---- сабвуфер ---- */
        const sub = audioCtx.createOscillator();
        sub.type = "sawtooth";
        sub.frequency.setValueAtTime(130, now);
        sub.frequency.exponentialRampToValueAtTime(24, now + dur);
        const subGain = audioCtx.createGain();
        subGain.gain.setValueAtTime(0.6, now);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        sub.connect(subGain);
        subGain.connect(audioCtx.destination);
        sub.start(now); sub.stop(now + dur);

        /* ---- высокий вой ---- */
        const whine = audioCtx.createOscillator();
        whine.type = "square";
        whine.frequency.setValueAtTime(3800, now);
        whine.frequency.linearRampToValueAtTime(2400, now + dur);
        const whineGain = audioCtx.createGain();
        whineGain.gain.setValueAtTime(0.06, now);
        whineGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        whine.connect(whineGain);
        whineGain.connect(audioCtx.destination);
        whine.start(now); whine.stop(now + dur);
    }

    /* ================= СЦЕНАРИЙ ================= */

    function start() {
        initAudio();
        buildup.classList.add("gone");
        startBtn.style.display = "none";

        const phrases = [
            "ты один?",
            "не оглядывайся",
            "он уже здесь",
            "он смотрит",
            "за твоей спиной",
            "он ближе, чем кажется",
            "не закрывай глаза",
            "он уже внутри"
        ];

        playDrone(5.2);

        let pi = 0;
        let stillRunning = true;

        function nextWhisper() {
            if (!stillRunning || pi >= phrases.length) return;
            whisper.textContent = phrases[pi];
            whisper.classList.add("on");
            pi++;
            setTimeout(function () {
                whisper.classList.remove("on");
                if (stillRunning) setTimeout(nextWhisper, 250);
            }, 550);
        }
        setTimeout(nextWhisper, 200);

        /* ---- СКРИМЕР ---- */
        setTimeout(function () {
            stillRunning = false;
            whisper.classList.remove("on");
            buildup.style.display = "none";

            playScream();
            screamBox.classList.add("on");

            if (navigator.vibrate) {
                try { navigator.vibrate([280, 40, 280, 40, 500, 60, 700]); } catch(e) {}
            }

            /* ---- ЗАТИХАНИЕ И ФИНАЛ ---- */
            setTimeout(function () {
                screamBox.classList.remove("on");
                screamBox.style.display = "none";
                ending.classList.add("on");

                setTimeout(function () {
                    typeFinal("СПОКОЙНОЙ НОЧИ");
                }, 2200);

            }, 2000);

        }, 5000);
    }

    function typeFinal(text) {
        let i = 0;
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        finalText.appendChild(cursor);

        function step() {
            if (i >= text.length) {
                setTimeout(function () {
                    cursor.style.display = "none";
                    subtext.classList.add("on");
                }, 2500);
                return;
            }
            const ch = text[i];
            cursor.insertAdjacentText("beforebegin", ch);
            i++;

            let delay = 260 + Math.random() * 220;
            if (ch === " ") delay = 700 + Math.random() * 400;
            if (Math.random() < 0.1) delay += 500;
            setTimeout(step, delay);
        }
        step();
    }

    startBtn.addEventListener("click", start);
})();
</script>

</body>
</html>
